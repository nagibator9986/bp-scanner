services:
  # База данных MongoDB (порт открыт только на localhost хоста)
  mongodb:
    image: mongo:latest
    container_name: nurbank_db
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # Бэкенд (FastAPI)
  backend:
    build: ./backend
    image: ps_ai_backend:latest
    container_name: nurbank_backend
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=nurbank_ai
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/app/uploads # Хранилище для документов
    restart: always

  # Фронтенд (React + Nginx); /api проксируется на бэкенд
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: /api
    image: ps_ai_frontend:latest
    container_name: nurbank_frontend
    depends_on:
      - backend
    environment:
      - BACKEND_UPSTREAM=backend:8000
    ports:
      - "3000:80"
    restart: always

volumes:
  mongo_data:
  backend_uploads:
