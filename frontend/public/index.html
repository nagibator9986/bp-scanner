<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#020617" />
        <meta name="description" content="AI BP Scanner — анализ и автоматизация бизнес-процессов" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 11V9h4M23 11V9h-4M9 21v2h4M23 21v2h-4M9 16h14' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
        <title>AI BP Scanner</title>
        <script>
            // Тема применяется до загрузки приложения — без «вспышки» при старте
            try {
                var theme = localStorage.getItem("bp-theme") || "dark";
                document.documentElement.classList.add(theme);
            } catch (e) {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body>
        <noscript>Для работы приложения включите JavaScript.</noscript>
        <div id="root"></div>
    </body>
</html>
