server {
    listen 80;
    server_name localhost;

    # Путь к собранной статике фронтенда
    root /usr/share/nginx/html;
    index index.html;

    # Обработка маршрутов React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к бэкенду
    location /api/ {
        # 'backend' — это имя сервиса из твоего docker-compose.yml
        proxy_pass http://bp-scanner:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Настройки для обработки тяжелых запросов (например, AI инференс)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Настройки кэширования статики (опционально)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}